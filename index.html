<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STIS - Temporary Map Access</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            margin: 0;
        }

        h1 {
            color: #17365D;
        }

        #mapContent,
        #expiredContent {
            display: none;
        }

        #expiredContent h1 {
            color: #C62828;
        }
    </style>
</head>

<body>

    <div id="mapContent">
        <h1>STIS - Sales Territory Intelligence System</h1>
        <h2>Temporary Map Access Test</h2>
        <p>Map access is currently active.</p>
        <p>No merchant data has been published.</p>
    </div>

    <div id="expiredContent">
        <h1>STIS - Access Expired</h1>
        <h2>This map link is no longer available.</h2>
        <p>Please contact the system administrator.</p>
    </div>

    <script>
        // Expiration test: October 25, 2026 at 9:00 AM Egypt time
        const expiryDate = new Date("2026-10-25T09:00:00+03:00");

        function checkExpiry() {
            const expired = Date.now() >= expiryDate.getTime();

            document.getElementById("mapContent").style.display =
                expired ? "none" : "block";

            document.getElementById("expiredContent").style.display =
                expired ? "block" : "none";
        }

        checkExpiry();

        // Check every 10 seconds
        setInterval(checkExpiry, 10000);

        // Discourage ordinary page saving
        document.addEventListener("contextmenu", function(e) {
            e.preventDefault();
        });

        document.addEventListener("keydown", function(e) {
            if ((e.ctrlKey || e.metaKey) &&
                e.key.toLowerCase() === "s") {
                e.preventDefault();
            }
        });
    </script>

</body>
</html>
