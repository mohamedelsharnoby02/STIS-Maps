
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STIS - Temporary Map Access</title>
</head>
<body style="font-family:Arial;text-align:center;padding:60px">

  <div id="mapContent" style="display:none">
    <h1>STIS - Sales Territory Intelligence System</h1>
    <h2>Temporary Map Access Test</h2>
    <p>Map access is currently active.</p>
    <p>No merchant data has been published.</p>
  </div>

  <div id="expiredContent" style="display:none">
    <h1>STIS - Access Expired</h1>
    <p>This map link is no longer available.</p>
  </div>

  <script>
    // Test expiration: October 26, 2026, 11:00 AM Egypt time
    const expiryDate = new Date("2026-10-26T11:00:00+03:00");

    function checkExpiry() {
      const expired = Date.now() >= expiryDate.getTime();

      document.getElementById("mapContent").style.display =
        expired ? "none" : "block";

      document.getElementById("expiredContent").style.display =
        expired ? "block" : "none";
    }

    checkExpiry();
    setInterval(checkExpiry, 10000);
  </script>

</body>
</html>
